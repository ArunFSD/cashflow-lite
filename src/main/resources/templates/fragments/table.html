<!-- The transaction table. Header stays visible while the body scrolls. -->
<div th:fragment="table" class="table-scroll">
    <table class="ledger">
        <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Name / from</th>
            <th class="hide-sm">Paid by</th>
            <th class="hide-sm">Card / app / bank</th>
            <th class="hide-md">Friend / customer</th>
            <th class="num">Amount</th>
            <th class="actions"><span class="sr-only">Actions</span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${result.rows()}" th:classappend="${r.deposit()} ? 'row-in' : 'row-out'">
            <td class="nowrap" th:text="${#temporals.format(r.date(), 'dd/MM/yyyy')}">24/10/2026</td>
            <td>
                <span class="badge" th:classappend="${r.deposit()} ? 'badge-in' : 'badge-out'" th:text="${r.typeLabel()}">Spend</span>
            </td>
            <td>
                <span class="strong" th:text="${r.title()}">Lunch</span>
                <small class="muted block" th:if="${r.notes() != null}" th:text="${r.notes()}">note</small>
            </td>
            <td class="hide-sm" th:text="${r.paymentLabel()}">GPay</td>
            <td class="hide-sm"><span class="muted" th:text="${r.paymentDetail() ?: '—'}">—</span></td>
            <td class="hide-md" th:text="${r.payee() ?: '—'}">—</td>
            <td class="num nowrap" th:classappend="${r.deposit()} ? 'pos' : 'neg'"
                th:text="(${r.deposit()} ? '+ ₹' : '− ₹') + ${#numbers.formatDecimal(r.amount(), 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
            <td class="actions">
                <a th:if="${r.deposit()}" th:href="@{/deposits/{id}/edit(id=${r.id()})}">Edit</a>
                <a th:unless="${r.deposit()}" th:href="@{/expenses/{id}/edit(id=${r.id()})}">Edit</a>
                <form th:if="${r.deposit()}" method="post" th:action="@{/deposits/{id}/delete(id=${r.id()})}"
                      class="inline-form" onsubmit="return confirm('Delete this deposit?');">
                    <button type="submit" class="link danger">Delete</button>
                </form>
                <form th:unless="${r.deposit()}" method="post" th:action="@{/expenses/{id}/delete(id=${r.id()})}"
                      class="inline-form" onsubmit="return confirm('Delete this expense?');">
                    <button type="submit" class="link danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${result.rows().isEmpty()}">
            <td colspan="8" class="empty">No entries match these filters.</td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Previous / next pages. pagePrefix is built by the controller and already holds the filters. -->
<nav th:fragment="pager" class="pager">
    <a th:classappend="${!result.hasPrevious()} ? 'disabled'"
       th:href="${pagePrefix} + '&page=' + ${result.page() - 1}">‹ Previous</a>
    <span>Page <strong th:text="${result.page() + 1}">1</strong> of <strong th:text="${result.totalPages()}">1</strong></span>
    <a th:classappend="${!result.hasNext()} ? 'disabled'"
       th:href="${pagePrefix} + '&page=' + ${result.page() + 1}">Next ›</a>
</nav>
