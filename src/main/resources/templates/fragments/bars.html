<!-- One breakdown card on the monthly page: a title and a bar per item. -->
<section class="card" th:fragment="bars(title, items)">
    <h2 class="card-title" th:text="${title}">Breakdown</h2>
    <p class="muted" th:if="${items.isEmpty()}">Nothing recorded this month.</p>
    <div class="bar-row" th:each="b : ${items}">
        <div class="bar-label">
            <span th:text="${b.label()}">Label</span>
            <strong th:text="${'₹' + #numbers.formatDecimal(b.amount(), 1, 'COMMA', 2, 'POINT')}">₹0.00</strong>
        </div>
        <div class="bar-track">
            <div class="bar-fill" th:style="'width:' + ${b.percent()} + '%'"></div>
        </div>
    </div>
</section>
