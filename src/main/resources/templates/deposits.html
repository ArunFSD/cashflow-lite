<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Deposits')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="shell">
    <section class="page-head">
        <div>
            <h1>Deposits</h1>
            <p class="totals">
                Shown total
                <strong class="shown-total pos" th:text="${'₹' + #numbers.formatDecimal(result.moneyIn(), 1, 'COMMA', 2, 'POINT')}">₹0.00</strong>
                <span class="muted" th:text="${result.totalRows() == 1 ? '· 1 entry' : '· ' + result.totalRows() + ' entries'}">· 0 entries</span>
            </p>
        </div>
        <button type="button" class="add-button" data-open-dialog="entryDialog">
            <span aria-hidden="true">+</span> Add deposit
        </button>
    </section>

    <div class="flash" data-flash role="status" th:if="${message}" th:text="${message}"></div>

    <th:block th:replace="~{fragments/filters :: bar('/deposits', false)}"></th:block>

    <section class="table-card">
        <th:block th:replace="~{fragments/table :: table}"></th:block>
    </section>
    <th:block th:replace="~{fragments/table :: pager}"></th:block>
</main>

<dialog id="entryDialog" class="entry-dialog"
        th:attr="data-open=${formOpen ? 'true' : 'false'},data-list-url=${baseUrl}">
    <form method="post" class="entry-form" novalidate data-entry-form th:object="${form}"
          th:action="${editingId == null} ? @{/deposits} : @{/deposits/{id}(id=${editingId})}">
        <header class="dialog-head">
            <h2 th:text="${editingId == null} ? 'Add deposit' : 'Edit deposit'">Add deposit</h2>
            <button type="button" class="icon-button" data-close-dialog aria-label="Close">×</button>
        </header>

        <div class="form-grid">
            <input type="hidden" th:field="*{version}">

            <div class="field">
                <label for="depositDate">Date</label>
                <div class="date-field">
                    <input id="depositDate" type="text" th:field="*{depositDate}" placeholder="DD/MM/YYYY"
                           inputmode="numeric" autocomplete="off" maxlength="10" data-date data-required
                           th:errorclass="is-invalid">
                    <button type="button" class="calendar-button" data-calendar aria-label="Open calendar">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path fill="currentColor" d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2zm13 8H4v10h16V10z"/>
                        </svg>
                    </button>
                    <input type="date" class="date-native" tabindex="-1" aria-hidden="true" data-date-native>
                </div>
                <small class="field-error" th:if="${#fields.hasErrors('depositDate')}" th:errors="*{depositDate}"></small>
            </div>

            <div class="field wide">
                <label for="receivedFrom">From whom</label>
                <input id="receivedFrom" type="text" th:field="*{receivedFrom}" list="partyList" data-combo
                       autocomplete="off" maxlength="150" placeholder="Pick a suggestion or type a name"
                       data-required th:errorclass="is-invalid">
                <small class="field-error" th:if="${#fields.hasErrors('receivedFrom')}" th:errors="*{receivedFrom}"></small>
            </div>

            <div class="field">
                <label for="amount">Amount (₹)</label>
                <input id="amount" type="number" step="0.01" min="0.01" inputmode="decimal" th:field="*{amount}"
                       autocomplete="off" data-required th:errorclass="is-invalid">
                <small class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></small>
            </div>

            <div class="field">
                <label for="receivedVia">How it came</label>
                <select id="receivedVia" th:field="*{receivedVia}" data-detail-select="#detailField">
                    <option th:each="m : ${paymentModes}" th:value="${m}" th:text="${m.label}"
                            th:attr="data-detail=${m.detailLabel ?: ''}"></option>
                </select>
            </div>

            <div class="field wide" id="detailField" hidden>
                <label for="paymentDetail"><span data-detail-label>Detail</span></label>
                <input id="paymentDetail" type="text" th:field="*{paymentDetail}" list="detailList" data-combo
                       autocomplete="off" maxlength="100" data-required th:errorclass="is-invalid">
                <small class="field-error" th:if="${#fields.hasErrors('paymentDetail')}" th:errors="*{paymentDetail}"></small>
            </div>

            <div class="field wide">
                <label for="notes">Notes <span class="muted">(optional)</span></label>
                <textarea id="notes" rows="2" th:field="*{notes}" maxlength="500" th:errorclass="is-invalid"></textarea>
                <small class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></small>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" class="ghost" data-close-dialog>Cancel</button>
            <button type="submit" class="primary">Save</button>
        </div>

        <datalist id="detailList">
            <option th:each="d : ${detailSuggestions}" th:value="${d}"></option>
        </datalist>
        <datalist id="partyList">
            <option th:each="p : ${partySuggestions}" th:value="${p}"></option>
        </datalist>
    </form>
</dialog>

<script th:src="@{/js/dropdowns.js}" defer></script>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
