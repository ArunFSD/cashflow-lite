<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>

<main class="shell narrow">
    <section class="card error-card">
        <p class="error-code" th:text="${status ?: 500}">500</p>
        <h1 th:text="${title ?: 'Something went wrong'}">Something went wrong</h1>
        <p class="muted" th:text="${message ?: 'Go back to the list and try again.'}">Go back to the list and try again.</p>
        <div class="form-actions">
            <a class="button primary" th:href="@{/expenses}">Expenses</a>
            <a class="button ghost" th:href="@{/transactions}">All transactions</a>
        </div>
    </section>
</main>
</body>
</html>
