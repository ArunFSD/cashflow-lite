spring:
  application:
    name: cashflow-lite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cashflow-lite}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root@123}
  jpa:
    open-in-view: false
    hibernate:
      # The schema comes from db/schema.sql. Hibernate only checks that the entities match it.
      ddl-auto: validate
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}
